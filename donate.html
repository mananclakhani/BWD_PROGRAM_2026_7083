
<html>

<head>
    <title>Medical Blood Donation Consent Form</title>
</head>

<body>

<center>

    <h2>BEST DONOR</h2>

    <h3>Medical Blood Donation Consent Form</h3>

    <form>

        <label for="fname">First Name:</label>
        <input type="text" id="fname">

        <br><br>

        <label for="lname">Last Name:</label>
        <input type="text" id="lname">

        <br><br>

        <label for="bdate">Birth Date:</label>
        <input type="date" id="bdate" name="bdate">

        <br><br>

        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone">

        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email">

        <br><br>

        <label>Have you donated previously?</label>

        <input type="radio" id="yes" name="donated">
        <label for="yes">Yes</label>

        <input type="radio" id="no" name="donated">
        <label for="no">No</label>

        <br><br>

        <label>
            In the last 6 months have you had any of the following?
        </label>

        <br><br>

        <input type="checkbox" id="tattoo">
        <label for="tattoo">Tattooing</label>

        <input type="checkbox" id="piercing">
        <label for="piercing">Piercing</label>

        <input type="checkbox" id="dental">
        <label for="dental">Dental extraction</label>

        <br><br>

        <input type="checkbox" id="surgery">
        <label for="surgery">Surgery</label>

        <br><br>

        <label for="medical">
            Medical History:
        </label>

        <br>

        <textarea id="medical" rows="4" cols="30"></textarea>

        <br><br>

        <input type="checkbox" id="agree">

        <label for="agree">
            I have read and understood all the information
            presented and answered all the questions truthfully.
        </label>

        <br><br>

        <label>Verification:</label>

        <br><br>

        <input type="checkbox" id="robot">
        <label for="robot">I'm not a robot</label>

        <br><br>

        <button type="submit">DONATE</button>

    </form>

</center>

</body>

</html>
